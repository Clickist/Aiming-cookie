<div class="w-full h-full block" style="display:block;">
<canvas id="shader-canvas-ANIMATION_36" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_36');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

varying vec2 v_texCoord;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = uv * 2.0 - 1.0;
    p.x *= u_resolution.x / u_resolution.y;

    float t = u_time * 0.15;
    
    // Create multiple layers of noise for the fluid effect
    float n = snoise(p * 0.5 + t);
    n += 0.5 * snoise(p * 1.0 - t * 0.8);
    n += 0.25 * snoise(p * 2.0 + t * 0.5);
    
    // Background color: Aiming Cookie Dark #0d0d0c
    vec3 bgColor = vec3(0.05, 0.05, 0.047); 
    
    // Accent colors from design system: Orange #f54e00 and a subtle Blue #3b82f6
    vec3 color1 = vec3(0.96, 0.306, 0.0); // Orange
    vec3 color2 = vec3(0.23, 0.51, 0.96); // Blue
    
    // Create the "energy" flow effect
    float energy = smoothstep(0.1, 0.8, n);
    float glow = exp(-3.0 * abs(n - 0.2));
    
    // Combine colors based on noise and position (matching image.png aura)
    vec3 finalColor = bgColor;
    finalColor = mix(finalColor, color2 * 0.3, smoothstep(-0.5, 0.5, n));
    finalColor = mix(finalColor, color1 * 0.6, glow * 0.2 * (1.0 - uv.x)); // Favor left side
    
    // Pulse effect
    float pulse = 0.95 + 0.05 * sin(u_time * 0.5);
    finalColor *= pulse;

    // Vignette
    float vignette = smoothstep(1.8, 0.6, length(p));
    finalColor *= vignette;

    gl_FragColor = vec4(finalColor, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();

<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_37');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  if (!container) return;

  // Robust sizing with fallbacks
  let width = container.clientWidth || window.innerWidth;
  let height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  
  const renderer = new THREE.WebGLRenderer({ 
    alpha: true, 
    antialias: true,
    powerPreference: "high-performance"
  });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // High contrast lighting system
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
  mainLight.position.set(5, 5, 5);
  scene.add(mainLight);

  const orangeLight = new THREE.PointLight(0xf54e00, 3, 20);
  orangeLight.position.set(-5, 3, 5);
  scene.add(orangeLight);

  const blueLight = new THREE.PointLight(0x3b82f6, 1.5, 15);
  blueLight.position.set(5, -3, 2);
  scene.add(blueLight);

  // Texture Loader
  const textureLoader = new THREE.TextureLoader();
  
  // Real app screens to showcase
  const screens = [
    { id: '{{DATA:SCREEN:SCREEN_32}}', label: 'COACH REPORT' },
    { id: '{{DATA:SCREEN:SCREEN_34}}', label: 'HISTORY' },
    { id: '{{DATA:SCREEN:SCREEN_16}}', label: 'UPLOAD' }
  ];

  const cards = [];
  const cardGeometry = new THREE.PlaneGeometry(3.6, 4.8);

  screens.forEach((screen, i) => {
    // High-visibility material with fallback color
    const material = new THREE.MeshPhongMaterial({ 
      color: 0x1c1b18,
      specular: 0x555555,
      shininess: 60,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.98
    });

    // Load actual texture from project
    textureLoader.load(screen.id, (texture) => {
      material.map = texture;
      material.color.set(0xffffff); // Reset color so texture shows naturally
      material.needsUpdate = true;
    }, undefined, (err) => {
      console.warn('Failed to load texture:', screen.id);
    });

    const card = new THREE.Mesh(cardGeometry, material);
    
    // Staggered 3D arrangement
    // Optimized for the tech-aura layout
    const xPos = -3.5 + (i * 0.7);
    const yPos = 1.0 - (i * 0.9);
    const zPos = -i * 2.2;
    
    card.position.set(xPos, yPos, zPos);
    card.rotation.set(-0.25, 0.5, 0.08); // Elegant tilt towards camera
    
    scene.add(card);
    cards.push({
      mesh: card,
      originalY: yPos,
      originalX: xPos,
      offset: i * 1.5
    });
  });

  camera.position.z = 9.5;
  camera.position.x = -1.2;

  function animate(time) {
    requestAnimationFrame(animate);
    
    const t = time * 0.0008;
    cards.forEach((card, i) => {
      // Smooth, high-fidelity floating
      card.mesh.position.y = card.originalY + Math.sin(t + card.offset) * 0.2;
      card.mesh.position.x = card.originalX + Math.cos(t * 0.7 + card.offset) * 0.1;
      
      // Subtle tilt animation
      card.mesh.rotation.y = 0.5 + Math.sin(t * 0.4 + card.offset) * 0.05;
      card.mesh.rotation.x = -0.25 + Math.cos(t * 0.3 + card.offset) * 0.04;
    });
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
  });

  animate(0);
})();

})();
</script>
