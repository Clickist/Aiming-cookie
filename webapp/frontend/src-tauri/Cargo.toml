[package]
name = "aiming-cookie-desktop"
version = "1.2.5"
description = "Aiming Cookie local-first desktop shell"
authors = ["Aiming Cookie"]
edition = "2021"

[lib]
name = "aiming_cookie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# deep-link feature：二次启动时把 argv 里的 deep-link URL 转交已运行实例的
# deep-link 插件（Windows 协议唤起走 argv，插件自身不监听）。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
sha2 = "0.10"
tauri-plugin-deep-link = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "processthreadsapi",
    "tlhelp32",
    "handleapi",
    "libloaderapi",
    "profileapi",
    "synchapi",
    "winbase",
] }
windows = { version = "0.61.3", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
windows-core = "0.61.2"
